<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FaceFlick - Face gesture flick keyboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FaceFlick">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>FaceFlick</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #cameraVideo {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 640px;
      height: 480px;
    }
  </style>

  <!-- MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>

  <script>
    // MediaPipe Face Detection for Flutter Web
    let faceMesh = null;
    let camera = null;
    let lastFaceData = { detected: false };
    let isMediaPipeReady = false;
    let isCameraReady = false;

    async function initMediaPipe() {
      console.log('Initializing MediaPipe...');
      try {
        faceMesh = new FaceMesh({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`;
          }
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceResults);
        isMediaPipeReady = true;
        console.log('MediaPipe Face Mesh initialized successfully');
        return true;
      } catch (e) {
        console.error('MediaPipe initialization error:', e);
        return false;
      }
    }

    async function startCamera() {
      console.log('Starting camera...');
      try {
        // ビデオ要素を作成
        let videoElement = document.getElementById('cameraVideo');
        if (!videoElement) {
          videoElement = document.createElement('video');
          videoElement.id = 'cameraVideo';
          videoElement.setAttribute('playsinline', 'true');
          videoElement.setAttribute('autoplay', 'true');
          document.body.appendChild(videoElement);
        }

        // MediaPipe Camera APIを使用
        camera = new Camera(videoElement, {
          onFrame: async () => {
            if (faceMesh && isMediaPipeReady) {
              await faceMesh.send({ image: videoElement });
            }
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });

        await camera.start();
        isCameraReady = true;
        console.log('Camera started successfully');
        return true;
      } catch (e) {
        console.error('Camera start error:', e);
        return false;
      }
    }

    function onFaceResults(results) {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // 顔の向きを推定
        const nose = landmarks[1];       // 鼻先
        const leftEye = landmarks[33];   // 左目
        const rightEye = landmarks[263]; // 右目
        const upperLip = landmarks[13];  // 上唇
        const lowerLip = landmarks[14];  // 下唇

        // 左右の傾き（Y軸回転）- 画面座標なので反転
        const headRotationY = -(nose.x - 0.5) * 90;

        // 上下の傾き（X軸回転）
        const headRotationX = (nose.y - 0.5) * 60;

        // 口の開き具合
        const mouthDistance = Math.abs(lowerLip.y - upperLip.y);
        const eyeDistance = Math.abs(rightEye.x - leftEye.x);
        const mouthOpenRatio = Math.min(1.0, Math.max(0, (mouthDistance / eyeDistance - 0.15) * 5));

        lastFaceData = {
          detected: true,
          headRotationX: headRotationX,
          headRotationY: headRotationY,
          headRotationZ: 0,
          mouthOpenRatio: mouthOpenRatio
        };
      } else {
        lastFaceData = { detected: false };
      }
    }

    function getLastFaceData() {
      return lastFaceData;
    }

    function getStatus() {
      return {
        mediaPipeReady: isMediaPipeReady,
        cameraReady: isCameraReady
      };
    }

    // グローバルに公開
    window.initMediaPipe = initMediaPipe;
    window.startCamera = startCamera;
    window.getLastFaceData = getLastFaceData;
    window.getStatus = getStatus;
  </script>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
